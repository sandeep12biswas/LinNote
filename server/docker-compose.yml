# Self-hosted sync stack: linnote-server (Axum) + PostgreSQL + MinIO.
# Phase 5 (weeks 11-14). `docker compose up` from this directory.

services:
  server:
    build: .
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://linnote:linnote@postgres:5432/linnote
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linnote
      POSTGRES_PASSWORD: linnote
      POSTGRES_DB: linnote
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: linnote
      MINIO_ROOT_PASSWORD: linnote-minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres-data:
  minio-data:
