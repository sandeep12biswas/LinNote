[package]
name = "linnote-server"
version = "0.1.0"
edition = "2021"
description = "Optional self-hosted sync server for LinNote (HTTP + WebSocket)."

# Phase 5 (weeks 11-14). Kept as a separate crate/deployable from the
# Tauri app (src-tauri/): this runs on a server, not on the client device.
[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
# aws-sdk-s3 = "1"  # or an S3-compatible client, for MinIO attachment storage
