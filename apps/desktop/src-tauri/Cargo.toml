[package]
name = "linnote"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# FileSystemPersistenceProvider (Desing architecture §15.1) and
# "open externally" for file attachments / YouTube (§10, §17).
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# Native file picker for "Insert File Attachment" (NTA-62, §10.1) — a real
# OS path is needed so "open externally" has something genuine to open;
# not needed for the workspace-asset copy itself (Phase 8/NTA-69).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

